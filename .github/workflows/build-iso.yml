name: Build NovaOS 1.0 Full Desktop RC3 ISO

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - "**"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

concurrency:
  # Unique group per run: a hung older runner cannot block a new attempt.
  group: novaos-iso-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build bootable NovaOS 1.0 Full Desktop RC3 ISO
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out NovaOS repository
        uses: actions/checkout@v4

      - name: Reassemble and patch NovaOS source archive
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v zstd >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y zstd
          }
          test -s source-parts/00
          cat source-parts/[0-9][0-9] > "$RUNNER_TEMP/novaos-source.tar.zst.b64"
          base64 --decode "$RUNNER_TEMP/novaos-source.tar.zst.b64" > "$RUNNER_TEMP/novaos-source.tar.zst"
          zstd --test "$RUNNER_TEMP/novaos-source.tar.zst"
          tar --zstd -xf "$RUNNER_TEMP/novaos-source.tar.zst" -C "$GITHUB_WORKSPACE"
          test -s apply-rc3-hotfix.py
          python3 apply-rc3-hotfix.py "$GITHUB_WORKSPACE"
          python3 apply-rc3-hotfix2.py "$GITHUB_WORKSPACE"
          python3 apply-rc3-hotfix3.py "$GITHUB_WORKSPACE"
          test -s scripts/build-iso.sh
          test -s scripts/verify-project.sh
          test -s overlay/usr/local/bin/novaos-installer
          test -s packages/novaos-live.x86_64
          chmod +x scripts/*.sh overlay/usr/local/bin/novaos-* overlay/usr/local/lib/novaos/*.sh
          ./scripts/verify-project.sh

      - name: Check runner disk space
        run: df -h

      - name: Build in an Arch Linux container
        run: |
          docker run --rm --privileged --security-opt seccomp=unconfined \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace archlinux:latest \
            bash -euc '
              # Use one freshly synchronized Tier-1 mirror for every repository,
              # including Multilib used by Wine in the archiso profile.
              printf "%s\\n" "Server = https://frankfurt.mirror.pkgbuild.com/\\$repo/os/\\$arch" > /etc/pacman.d/mirrorlist
              pacman -Syyu --noconfirm --needed archiso python sudo git base-devel binutils libarchive
              ./scripts/verify-project.sh
              ./scripts/build-iso.sh
            '

      - name: Upload ISO and checksum
        uses: actions/upload-artifact@v4
        with:
          name: NovaOS-1.0-FullDesktop-ISO
          path: |
            out/NovaOS-1.0-x86_64.iso
            out/NovaOS-1.0-x86_64.iso.sha256
          if-no-files-found: error
          retention-days: 14
